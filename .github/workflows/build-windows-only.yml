
name: Build Windows Only

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master   # 如果你改的是 master，就改成 master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean and get packages
        run: |
          cd simple_live_app
          flutter clean
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path windows\flutter\ephemeral) { Remove-Item -Recurse -Force windows\flutter\ephemeral }
          flutter pub get

      - name: Build Windows
        run: |
          cd simple_live_app
          flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            simple_live_app/build/windows/x64/runner/Release/**
